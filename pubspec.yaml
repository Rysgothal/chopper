  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  injectable: ^2.5.0
  go_router: ^18.0.2
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.4.0
  dio_cache_interceptor: ^4.0.7
  graphql_flutter: ^5.1.2
  graphql: ^5.1.2
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.6.0+eol
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_performance: ^0.11.6
  flutter_local_notifications: ^23.0.0-dev.3
