  font_awesome_flutter: ^11.0.0
  cached_network_image: ^4.0.4
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^3.2.3
  injectable_generator: ^2.6.2
  drift_dev: ^2.18.0
  graphql_codegen: ^3.0.0
  json_serializable: ^6.8.0
  custom_lint: ^0.8.1
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
